name: create images with text arabic

on:
  schedule:
    - cron: '*/40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Arabic support & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install feedparser requests Pillow arabic-reshaper python-bidi
      
      - name: Generate image
        run: python generate_news_image.py
        env:
          PYTHONIOENCODING: utf-8
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add output.webp last_article.txt
          git diff --cached --quiet || git commit -m "Auto news image $(date +'%Y-%m-%d %H:%M')"
          git push
